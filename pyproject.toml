[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-harness"
version = "0.2.0"
description = "A thin layer that makes any coding agent (Claude Code, Codex, Gemini CLI, Cursor, Kimi Code, Copilot) better on large codebases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# Commands on PATH, so host configs committed to a repo say `agentic-harness-mcp`
# instead of a path that only exists on one machine.
[project.scripts]
agentic-harness-mcp = "mcp_server:main"
agentic-harness-setup = "kit.setup:main"
agentic-harness-review = "planes.verify.review:main"
agentic-harness-perf = "planes.verify.perf:main"
agentic-harness-gate = "kit.gate_hook:main"
agentic-harness-run = "run:main"

[tool.setuptools]
py-modules = ["mcp_server", "run"]
packages = ["core", "core.tools", "planes", "planes.context", "planes.verify", "kit"]

[tool.setuptools.package-data]
kit = ["coding-agent-setup/**/*", "coding-agent-setup/**/.*"]

[tool.pytest.ini_options]
# Optional: the suite is plain unittest and also runs under pytest if you have it.
testpaths = ["tests"]
